<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Gradient (Obsidian to Midnight) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070E"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Scanning Highlight Gradient with SMIL animation for native browser tab playback -->
    <linearGradient id="scnScan" x1="-120%" y1="0%" x2="-20%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="42%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="58%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="68%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <animate attributeName="x1" from="-120%" to="120%" dur="3.4s" repeatCount="indefinite" />
      <animate attributeName="x2" from="-20%" to="220%" dur="3.4s" repeatCount="indefinite" />
    </linearGradient>

    <style>
      @keyframes calmPulse {
        0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 0.5px rgba(56,189,248,0.4)); }
        50% { opacity: 0.95; filter: drop-shadow(0 0 1.2px rgba(56,189,248,0.8)); }
      }
      .beacon {
        animation: calmPulse 3.4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .beacon {
          animation: none !important;
          opacity: 0.7 !important;
          filter: none !important;
        }
        animate {
          dur: 0s !important;
          repeatCount: 0 !important;
        }
      }
      @media (prefers-color-scheme: light) {
        .bg-card {
          fill: #060913;
          stroke: #1E293B;
        }
      }
    </style>
  </defs>

  <!-- Container: High-contrast dark squircle ensuring visibility in all tab styles -->
  <rect class="bg-card" width="32" height="32" rx="7.5" fill="url(#bgGrad)"/>
  <rect width="30" height="30" x="1" y="1" rx="6.5" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- SCN Monogram (Grid-aligned, high-contrast, recognizable at 16x16) -->
  <g fill="none" stroke="url(#scnScan)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- S -->
    <path d="M 11.5 10.5 H 8 A 2 2 0 0 0 6 12.5 V 13.5 A 2 2 0 0 0 8 15.5 H 9.5 A 2 2 0 0 1 11.5 17.5 V 18.5 A 2 2 0 0 1 9.5 20.5 H 6"/>
    <!-- C -->
    <path d="M 19 12 H 16 A 2.5 2.5 0 0 0 13.5 14.5 V 16.5 A 2.5 2.5 0 0 0 16 19 H 19"/>
    <!-- N -->
    <path d="M 21 20.5 V 10.5 L 26.5 20.5 V 10.5"/>
  </g>

  <!-- Subtle Ambient Beacon Node -->
  <circle class="beacon" cx="26.5" cy="7.5" r="1.1" fill="#38BDF8"/>
</svg>
